name: Build desktop distributions
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/build/pyinstaller-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - name: Install release dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[dev,release]'
      - name: Fix the build timestamp and verify the release version
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          version=$(python -c 'from gitqt import __version__; print(__version__)')
          metadata_version=$(python -c 'from importlib.metadata import version; print(version("gitqt"))')
          test "$version" = "$metadata_version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$version"; fi
      - name: Run source acceptance tests
        run: python -m pytest -q
      - name: Build frozen application and portable archive
        run: python scripts/build_release.py
      - name: Smoke test the frozen application outside the source checkout
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then app="$GITHUB_WORKSPACE/dist/GitQt.app/Contents/MacOS/GitQt";
          elif [ "$RUNNER_OS" = Windows ]; then app="$GITHUB_WORKSPACE/dist/GitQt/GitQt.exe";
          else app="$GITHUB_WORKSPACE/dist/GitQt/GitQt"; fi
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          "$app" --version
          "$app" --smoke-test
      - name: Build native installer
        run: python scripts/package_installers.py
      - name: Verify Linux install, reinstall, and uninstall lifecycle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package=$(realpath dist/releases/*.deb)
          install_root="$RUNNER_TEMP/gitqt-installed"
          settings="$RUNNER_TEMP/gitqt-settings"
          sudo mkdir -p "$install_root/var/lib/dpkg" "$install_root/var/log"
          mkdir -p "$settings"
          sudo touch "$install_root/var/lib/dpkg/status"
          touch "$settings/retained-after-uninstall"
          for pass in install reinstall; do
            sudo dpkg --root="$install_root" \
              --admindir="$install_root/var/lib/dpkg" \
              --log="$install_root/var/log/dpkg.log" \
              --unpack "$package"
            test -x "$install_root/opt/gitqt/GitQt"
            test -L "$install_root/usr/bin/gitqt"
            test -f "$install_root/usr/share/applications/org.gitqt.desktop.desktop"
          done
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH XDG_CONFIG_HOME="$settings" \
            "$install_root/opt/gitqt/GitQt" --version
          env -u PYTHONPATH XDG_CONFIG_HOME="$settings" \
            "$install_root/opt/gitqt/GitQt" --smoke-test
          sudo dpkg --root="$install_root" \
            --admindir="$install_root/var/lib/dpkg" \
            --log="$install_root/var/log/dpkg.log" \
            --remove gitqt
          test ! -e "$install_root/opt/gitqt/GitQt"
          test ! -e "$install_root/usr/bin/gitqt"
          test ! -e "$install_root/usr/share/applications/org.gitqt.desktop.desktop"
          test -f "$settings/retained-after-uninstall"
      - name: Verify Windows install, reinstall, and uninstall lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Resolve-Path 'dist/releases/*-setup.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'GitQt installed Ω'
          $settings = Join-Path $env:APPDATA 'GitQt'
          New-Item -ItemType Directory -Force -Path $settings | Out-Null
          Set-Content -Path (Join-Path $settings 'retained-after-uninstall') -Value keep
          $installArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="{0}"' -f $installDir))
          foreach ($pass in @('install', 'reinstall')) {
            $process = Start-Process -FilePath $installer -ArgumentList $installArgs -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "$pass failed with exit code $($process.ExitCode)" }
            if (-not (Test-Path (Join-Path $installDir 'GitQt.exe'))) { throw 'GitQt.exe is missing' }
          }
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          foreach ($check in @('--version', '--smoke-test')) {
            $process = Start-Process -FilePath (Join-Path $installDir 'GitQt.exe') -ArgumentList $check -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "$check failed with exit code $($process.ExitCode)" }
          }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $process = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "uninstall failed with exit code $($process.ExitCode)" }
          if (Test-Path (Join-Path $installDir 'GitQt.exe')) { throw 'GitQt.exe survived uninstall' }
          if (-not (Test-Path (Join-Path $settings 'retained-after-uninstall'))) { throw 'settings were removed' }
      - name: Verify macOS install, reinstall, and uninstall lifecycle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          image=$(realpath dist/releases/*.dmg)
          mount="$RUNNER_TEMP/GitQt image Ω"
          install="$RUNNER_TEMP/Applications with spaces"
          settings="$HOME/Library/Application Support/GitQt"
          mkdir -p "$mount" "$install" "$settings"
          touch "$settings/retained-after-uninstall"
          hdiutil attach "$image" -mountpoint "$mount" -nobrowse -readonly
          trap 'hdiutil detach "$mount"' EXIT
          for pass in install reinstall; do
            ditto "$mount/GitQt.app" "$install/GitQt.app"
            test -x "$install/GitQt.app/Contents/MacOS/GitQt"
          done
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$install/GitQt.app/Contents/MacOS/GitQt" --version
          env -u PYTHONPATH "$install/GitQt.app/Contents/MacOS/GitQt" --smoke-test
          rm -rf "$install/GitQt.app"
          test ! -e "$install/GitQt.app"
          test -f "$settings/retained-after-uninstall"
          hdiutil detach "$mount"
          trap - EXIT
      - name: Build Python source and wheel artifacts
        run: python -m build
      - name: Generate and verify final checksums
        run: python scripts/checksum_artifacts.py && python scripts/checksum_artifacts.py --verify
      - uses: actions/upload-artifact@v4
        with:
          name: GitQt-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            dist/releases/*
            dist/*.whl
            dist/*.tar.gz
            dist/*.sha256
# This workflow only produces reviewable artifacts. Public releases require the
# signing/notarization, corresponding-source, and platform acceptance gates in RELEASE.md.
