[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitqt"
version = "0.1.0"
description = "A cross-platform Git desktop client built with Python and Qt."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "GitQt contributors" }
]
dependencies = [
  "PySide6>=6.8",
]

[project.optional-dependencies]
dev = [
  "black",
  "pytest",
  "pytest-qt",
  "ruff",
]

release = ["pyinstaller==6.22.3", "build>=1.2,<2", "Pillow>=11,<13"]

[project.scripts]
gitqt = "gitqt.main:main"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
